[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rulepilot-api"
version = "0.3.0"
description = "RulePilot AI API for continuous financial rule intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.14.1",
    "google-adk==2.10.0",
    "google-genai==2.30.1",
    "google-cloud-firestore==2.33.0",
    "opentelemetry-api==1.42.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
